<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:," />
  <title>Вход — Server Billing</title>
  <style>
    :root {
      color-scheme: dark; --bg: #0b0915; --surface: #121022; --field: #15122a; --border-strong: #6b63a8;
      --text: #ece9f9; --muted: #a9a2c9; --accent: #9c93ff; --accent-ink: #0b0915; --danger: #ff8e9a;
      --danger-bg: #351c25; --ring: #b0a8ff; --ring-soft: rgba(176,168,255,.2); --danger-soft: rgb(255 142 154 / .18);
      --line-soft: rgb(156 147 255 / .12); --grad-card: linear-gradient(180deg,#16132c 0%,#121022 62%);
      --glow: 0 8px 20px -10px rgb(156 147 255 / .6);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 16px; background: var(--bg);
      color: var(--text); font: 14px/1.25 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    .wrap { width: min(380px, 100%); display: grid; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 400; padding-left: 4px; letter-spacing: .01em; }
    .mark { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--accent);
      color: var(--accent-ink); font-size: 11px; font-weight: 600; }
    .card { background: var(--grad-card); border: 1px solid var(--line-soft); border-radius: 24px; padding: 32px;
      display: grid; gap: 16px; box-shadow: 0 18px 48px -32px rgb(0 0 0 / .9); }
    h1 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 500; }
    .sub { margin: -8px 0 0; font-size: 13px; line-height: 18px; color: var(--muted); }
    label { display: grid; gap: 6px; font-size: 13px; line-height: 18px; color: var(--muted); }
    input { height: 40px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--field);
      color: var(--text); font: inherit; font-size: 14px; }
    input::placeholder { color: var(--muted); }
    input:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
    input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
    button { height: 40px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
      font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: var(--glow); }
    button:hover:not(:disabled) { background: var(--text); }
    button:disabled { opacity: .5; cursor: progress; }
    button:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
    .err { margin: 0; padding: 12px 16px; border-radius: 14px; background: var(--danger-bg); color: var(--danger);
      font-size: 13px; line-height: 18px; }
    .err[hidden] { display: none; }
    @media (max-width: 480px) { .card { padding: 24px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true">S</span><span>Server Billing</span></div>
    <form id="login" class="card">
      <h1>Вход</h1>
      <p class="sub">Панель синхронизации биллингов</p>
      <label for="password">Пароль
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Войти</button>
      <p id="err" class="err" role="alert" hidden></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('login'), err = document.getElementById('err');
    const input = document.getElementById('password'), btn = form.querySelector('button');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (btn.disabled) return;
      err.hidden = true;
      input.removeAttribute('aria-invalid');
      btn.disabled = true; btn.textContent = 'Вход…'; btn.setAttribute('aria-busy', 'true');
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: new FormData(form).get('password') || '' }) });
        if (res.ok) { location.href = '/'; return; }
        err.textContent = res.status === 401 ? 'Неверный пароль'
          : res.status === 429 ? 'Слишком много попыток. Подождите минуту и попробуйте снова.'
          : 'Не удалось войти. Попробуйте ещё раз.';
        err.hidden = false; input.setAttribute('aria-invalid', 'true');
        input.setAttribute('aria-describedby', 'err'); input.focus();
      } catch (e) { err.textContent = 'Не удалось войти. Попробуйте ещё раз.'; err.hidden = false; }
      finally { btn.disabled = false; btn.textContent = 'Войти'; btn.removeAttribute('aria-busy'); }
    });
  </script>
</body>
</html>
